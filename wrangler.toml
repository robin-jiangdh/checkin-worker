#:schema node_modules/wrangler/config-schema.json
name = "checkin-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Frontend is embedded into the Worker bundle (public/index.html via
# esbuild --loader:.html=text, served at GET /) — no [assets] needed, which
# also keeps the pure-API deploy script working.

[[d1_databases]]
binding = "DB"
database_name = "checkin_db"
database_id = "720f9195-8c8c-4f64-ab6b-eef2f4220083" # created 2026-10-07

[triggers]
crons = ["*/15 * * * *"] # sweep every 15 min; per-account checkin_after window decides who runs

[vars]
CHECKIN_TZ = "Asia/Shanghai" # the timezone checkin_after HH:MM is interpreted in

# Secrets (set with `wrangler secret put`):
#   ADMIN_TOKEN    — bearer token required on /api/* (unset = no auth, dev only)
#   ENCRYPTION_KEY — base64 of 32 random bytes; encrypts password/access_token/session at rest
#                    generate: openssl rand -base64 32
